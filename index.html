<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Mở Dấu Việt – hành trình di sản qua mã QR, không cần cài ứng dụng." />
    <title>Mở Dấu Việt</title>
    <script>
      // Áp theme trước khi vẽ để tránh nháy màu
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme'); // ?theme=dark|light cho demo/chụp ảnh
          var t = q === 'dark' || q === 'light' ? q : localStorage.getItem('mdv.theme');
          if (q) localStorage.setItem('mdv.theme', q);
          if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
