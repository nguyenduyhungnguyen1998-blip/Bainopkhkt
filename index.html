<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Mở Dấu Việt – hành trình di sản qua mã QR, không cần cài ứng dụng." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="img/icon-192.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mở Dấu Việt" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mở Dấu Việt</title>
    <style>
      /* Splash boot: hiện ngay từ first paint, Preact render sẽ thay thế. */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #07111f;
        color: #e8d9a0;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 99;
      }
      html[data-theme='light'] #splash {
        background: #f4f1ea;
        color: #5a2320;
      }
      #splash .brand {
        text-align: center;
        letter-spacing: 0.04em;
      }
      #splash .brand h1 {
        font-size: 26px;
        font-weight: 800;
        margin: 0 0 6px;
      }
      #splash .brand p {
        font-size: 13px;
        opacity: 0.7;
        margin: 0;
      }
      #splash .dot {
        width: 54px;
        height: 54px;
        margin: 0 auto 14px;
        border-radius: 50%;
        border: 3px solid currentColor;
        position: relative;
        animation: splash-pulse 1.6s ease-out infinite;
      }
      /* Thanh tải + mascot chạy song song: % thật theo mốc khởi động (--bp do main.tsx đẩy). */
      #splash .track {
        position: relative;
        width: min(240px, 62vw);
        height: 4px;
        margin: 18px auto 0;
        border-radius: 4px;
        background: rgba(232, 217, 160, 0.22);
      }
      html[data-theme='light'] #splash .track {
        background: rgba(90, 35, 32, 0.18);
      }
      #splash .track .fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: calc(var(--bp, 6) * 1%);
        border-radius: 4px;
        background: currentColor;
        transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #splash .runner {
        position: absolute;
        left: calc(var(--bp, 6) * 1%);
        top: 10px;
        width: 44px;
        height: 44px;
        transform: translateX(-50%);
        transition: left 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        animation: splash-run 0.6s ease-in-out infinite;
        pointer-events: none;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
      }
      @keyframes splash-run {
        0%,
        100% {
          transform: translateX(-50%) translateY(0) rotate(-4deg);
        }
        50% {
          transform: translateX(-50%) translateY(4px) rotate(4deg);
        }
      }
      #splash .dot::after {
        content: '';
        position: absolute;
        inset: 14px;
        border-radius: 50%;
        background: currentColor;
      }
      @keyframes splash-pulse {
        0% {
          transform: scale(0.92);
          opacity: 0.9;
        }
        60%,
        100% {
          transform: scale(1.06);
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .dot,
        #splash .runner {
          animation: none;
        }
      }
    </style>
    <script>
      // Áp theme trước khi vẽ để tránh nháy màu
      (function () {
        try {
          // Mốc tiến độ thật: main.tsx gọi __bp(0-100) theo từng giai đoạn khởi động.
          window.__bp = function (v) {
            var s = document.getElementById('splash');
            if (s) s.style.setProperty('--bp', Math.max(0, Math.min(100, v)));
          };
          var q = new URLSearchParams(location.search).get('theme'); // ?theme=dark|light cho demo/chụp ảnh
          var t = q === 'dark' || q === 'light' ? q : localStorage.getItem('mdv.theme');
          if (q) localStorage.setItem('mdv.theme', q);
          if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
          // Cỡ chữ % + độ phẳng nền %; migrate một lần từ khoá mức rời cũ.
          var pct = function (key, legacyKey, legacyMap, dflt) {
            var v = localStorage.getItem(key);
            if (v != null && isFinite(+v)) return +v;
            var lv = localStorage.getItem(legacyKey);
            if (lv != null && lv in legacyMap) {
              localStorage.setItem(key, String(legacyMap[lv]));
              localStorage.removeItem(legacyKey);
              return legacyMap[lv];
            }
            return dflt;
          };
          var fp = pct('mdv.fontPct', 'mdv.font', { md: 100, lg: 112, xl: 125 }, 100);
          if (fp !== 100) document.documentElement.style.fontSize = fp + '%';
          var fl = pct('mdv.flatPct', 'mdv.contrast', { on: 100, off: 0 }, 0);
          if (fl > 0) document.documentElement.style.setProperty('--flat', String(fl / 100));
          if (fl >= 100) document.documentElement.dataset.contrast = 'on';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="splash" aria-hidden="true">
        <div class="brand">
          <div class="dot"></div>
          <h1>Mở Dấu Việt</h1>
          <p>Hành trình di sản qua mã QR</p>
          <div class="track">
            <span class="fill"></span>
            <img class="runner" src="img/mascot.webp" alt="" width="44" height="44" />
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
