name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: D2 Content Validator
        run: npm run validate
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: D7 Perf budget (JS gzip <= 120 KB)
        run: |
          total=$(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c)
          echo "JS gzip total: $total bytes"
          test "$total" -le 122880
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
