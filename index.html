    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />

    <title>Mở Dấu Việt</title>
    <script>
      // Áp theme trước khi vẽ để tránh nháy màu
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme'); // ?theme=dark|light cho demo/chụp ảnh
          var t = q === 'dark' || q === 'light' ? q : localStorage.getItem('mdv.theme');
          if (q) localStorage.setItem('mdv.theme', q);
          if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
